apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-task-tracker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-task-tracker
  template:
    metadata:
      labels:
        app: devops-task-tracker
    spec:
      containers:
        - name: devops-task-tracker
          image: shashankshashank123/devops-task-tracker:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000